<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
      .chat-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        height: 100vh;
      }

      .chat-header {
        width: 100%;
        padding: 20px;
        text-align: center;
        font-size: 24px;
        font-weight: bold;
        background-color: #f2f2f2;
      }

      .chat-box {
        width: 70%;
        height: 60%;
        overflow-y: scroll;
        padding: 20px;
        background-color: #fff;
        box-shadow: 2px 2px 5px #ccc;
        border-radius: 10px;
        margin-top: 20px;
      }

      .chat-box .message-container {
        display: flex;
        justify-content: flex-start;
        align-items: flex-start;
        margin-bottom: 20px;
      }

      .chat-box .message-container.user {
        justify-content: flex-end;
        align-items: flex-end;
      }

      .chat-box .message {
        background-color: #f2f2f2;
        padding: 10px;
        border-radius: 10px;
        max-width: 70%;
      }

      .chat-input {
        width: 70%;
        padding: 20px;
        box-sizing: border-box;
        border-radius: 10px;
        border: none;
        margin-top: 20px;
        font-size: 18px;
        outline: none;
        border: 2px solid black;
      }
    </style>
  
  </head>
  <body>
    <div class="chat-container">
      <div class="chat-header">
        旅程设计师（定制化您的出游）
      </div>
      <div class="chat-box" id="chat-box">
      </div>
      <input class="chat-input" id="chat-input" type="text" placeholder="Enter your message here"></input>
    </div>

    <script>
      const chatBox = document.getElementById("chat-box");
      const chatInput = document.getElementById("chat-input");
      
      addMessage("您好！我是您的智能旅行计划师。请告诉我你想去哪里旅行？您可以直接回复我目的地，例如日本，香港，或者西双版纳。", false);
      chatInput.addEventListener("keyup", function(event) {
        if (event.keyCode === 13) {
          sendMessage();
        }
      });

      // 生成新的userid
      function generateUserId() {
        // 这里可以使用一些算法来生成一个独有的userid
        // 这里只是简单地生成一个随机数
        return Math.floor(Math.random() * 1000000).toString();
      }

      function sendMessage() {

        // 获取userid，如果之前已经生成过就从localStorage中获取，否则生成一个新的
        let userid = localStorage.getItem('userid');
        if (!userid) {
          userid = generateUserId();
          localStorage.setItem('userid', userid);
        }

        // 刷新页面时生成新的userid
        window.addEventListener('beforeunload', function() {
          localStorage.removeItem('userid');
        });

        const message = chatInput.value;
        if (!message) {
          return;
        }
        addMessage(message, true);
        chatInput.value = "";

        fetch("https://jiana-hackathon-chatbot-openai-api-ai--59c6db2.hf.space/run/predict", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ 
            // message: message
            data: [
              message,
              Math.floor(Math.random() * 1000000).toString(),
              userid,
            ] 
          })
        })
          .then(res => res.json())
          .then(data => {
            addMessage(data.data[1], false);
          });

        }

        function addMessage(message, isUser) {
          const messageContainer = document.createElement("div");
          messageContainer.classList.add("message-container");
          if (isUser) {
            messageContainer.classList.add("user");
            // messageContainer.style.backgroundColor = "blue"; 
          }

          const messageElement = document.createElement("div");
          messageElement.classList.add("message");
          messageElement.innerText = message;
          if (isUser == false) {
            messageElement.style.backgroundColor = "#4ECF5B"; 
          }


          messageContainer.appendChild(messageElement);
          chatBox.appendChild(messageContainer);
          chatBox.scrollTop = chatBox.scrollHeight;
        }
    </script>
  </body>
</html>
