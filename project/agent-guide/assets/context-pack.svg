<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 505" role="img" aria-labelledby="title desc"><title id="title">上下文与持久状态</title><desc id="desc">外部资料和任务状态经过按需选择，进入本次上下文窗口，模型行动后更新状态；历史全量日志保留在外部。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#6683aa"/></marker></defs><rect width="900" height="100%" fill="#f5f8fd" rx="14"/><g font-family="Inter,Noto Sans SC,Microsoft YaHei,sans-serif"><polyline points="265,95 300,95 300,165 330,165" fill="none" stroke="#6683aa" stroke-width="2.4" marker-end="url(#arrow)"/><text x="301" y="66" font-size="17" text-anchor="middle" fill="#50647f" paint-order="stroke" stroke="#f5f8fd" stroke-width="7">按需读取</text><polyline points="265,310 300,310 300,250 330,250" fill="none" stroke="#6683aa" stroke-width="2.4" marker-end="url(#arrow)"/><text x="296" y="355" font-size="17" text-anchor="middle" fill="#50647f" paint-order="stroke" stroke="#f5f8fd" stroke-width="7">选择</text><polyline points="580,200 645,200" fill="none" stroke="#6683aa" stroke-width="2.4" marker-end="url(#arrow)"/><polyline points="760,250 760,400 145,400 145,365" fill="none" stroke="#6683aa" stroke-width="2.4" marker-end="url(#arrow)"/><text x="468" y="390" font-size="17" text-anchor="middle" fill="#50647f" paint-order="stroke" stroke="#f5f8fd" stroke-width="7">更新状态并保存证据</text><rect x="25" y="45" width="240" height="100" rx="10" fill="#fff" stroke="#c3d3e7" stroke-width="1.5"/><text x="145.0" y="76" text-anchor="middle" font-size="21" font-weight="700" fill="#14304f">外部资料</text><text x="145.0" y="102" text-anchor="middle" font-size="17" fill="#14304f">政策原文、文件、日志</text><rect x="25" y="265" width="240" height="100" rx="10" fill="#fff" stroke="#c3d3e7" stroke-width="1.5"/><text x="145.0" y="296" text-anchor="middle" font-size="21" font-weight="700" fill="#14304f">任务状态与记忆</text><text x="145.0" y="322" text-anchor="middle" font-size="17" fill="#14304f">来源、作用域、有效期</text><rect x="330" y="105" width="250" height="205" rx="10" fill="#155ce7" stroke="#155ce7" stroke-width="1.5"/><text x="455.0" y="136" text-anchor="middle" font-size="21" font-weight="700" fill="#fff">本次上下文包</text><text x="455.0" y="162" text-anchor="middle" font-size="17" fill="#fff">当前目标与边界</text><text x="455.0" y="188" text-anchor="middle" font-size="17" fill="#fff">相关证据与已知事实</text><text x="455.0" y="214" text-anchor="middle" font-size="17" fill="#fff">未决问题与下一步</text><text x="455.0" y="240" text-anchor="middle" font-size="17" fill="#fff">只放当前需要的信息</text><rect x="645" y="140" width="230" height="110" rx="10" fill="#fff" stroke="#c3d3e7" stroke-width="1.5"/><text x="760.0" y="171" text-anchor="middle" font-size="21" font-weight="700" fill="#14304f">模型与工具循环</text><text x="760.0" y="197" text-anchor="middle" font-size="17" fill="#14304f">生成动作、取得观察</text><text x="450" y="467" text-anchor="middle" font-size="17" fill="#536b88">资料存着 ≠ 模型本轮已经看见；压缩时保留否定条件与未完成事项。</text></g></svg>