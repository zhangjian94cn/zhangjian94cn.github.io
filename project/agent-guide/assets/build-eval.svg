<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 495" role="img" aria-labelledby="title desc"><title id="title">从 Spec 到评估的开发循环</title><desc id="desc">先写需求与样本，做最小实现，按结果评估，失败回到修复，通过则小范围使用，并把新失败加入回归集。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#6683aa"/></marker></defs><rect width="900" height="100%" fill="#f5f8fd" rx="14"/><g font-family="Inter,Noto Sans SC,Microsoft YaHei,sans-serif"><polyline points="260,95 335,95" fill="none" stroke="#6683aa" stroke-width="2.4" marker-end="url(#arrow)"/><polyline points="565,95 640,95" fill="none" stroke="#6683aa" stroke-width="2.4" marker-end="url(#arrow)"/><polyline points="755,145 755,280" fill="none" stroke="#6683aa" stroke-width="2.4" marker-end="url(#arrow)"/><text x="793" y="219" font-size="17" text-anchor="middle" fill="#50647f" paint-order="stroke" stroke="#f5f8fd" stroke-width="7">通过门槛</text><polyline points="755,145 755,212 450,212 450,280" fill="none" stroke="#6683aa" stroke-width="2.4" marker-end="url(#arrow)"/><text x="594" y="201" font-size="17" text-anchor="middle" fill="#50647f" paint-order="stroke" stroke="#f5f8fd" stroke-width="7">未通过</text><polyline points="640,330 565,330" fill="none" stroke="#6683aa" stroke-width="2.4" marker-end="url(#arrow)"/><polyline points="335,330 260,330" fill="none" stroke="#6683aa" stroke-width="2.4" marker-end="url(#arrow)"/><polyline points="145,280 145,190 450,190 450,145" fill="none" stroke="#6683aa" stroke-width="2.4" marker-end="url(#arrow)"/><text x="284" y="180" font-size="17" text-anchor="middle" fill="#50647f" paint-order="stroke" stroke="#f5f8fd" stroke-width="7">重新验证</text><rect x="30" y="45" width="230" height="100" rx="10" fill="#fff" stroke="#c3d3e7" stroke-width="1.5"/><text x="145.0" y="76" text-anchor="middle" font-size="21" font-weight="700" fill="#14304f">Spec 与固定样本</text><text x="145.0" y="102" text-anchor="middle" font-size="17" fill="#14304f">用户故事、验收、边界</text><rect x="335" y="45" width="230" height="100" rx="10" fill="#155ce7" stroke="#155ce7" stroke-width="1.5"/><text x="450.0" y="76" text-anchor="middle" font-size="21" font-weight="700" fill="#fff">最小可行实现</text><text x="450.0" y="102" text-anchor="middle" font-size="17" fill="#fff">模型、工具、执行器</text><rect x="640" y="45" width="230" height="100" rx="10" fill="#fff" stroke="#c3d3e7" stroke-width="1.5"/><text x="755.0" y="76" text-anchor="middle" font-size="21" font-weight="700" fill="#14304f">结果评估</text><text x="755.0" y="102" text-anchor="middle" font-size="17" fill="#14304f">质量、成本、失败模式</text><rect x="640" y="280" width="230" height="100" rx="10" fill="#fff" stroke="#c3d3e7" stroke-width="1.5"/><text x="755.0" y="311" text-anchor="middle" font-size="21" font-weight="700" fill="#14304f">小范围使用</text><text x="755.0" y="337" text-anchor="middle" font-size="17" fill="#14304f">记录返工与异常</text><rect x="335" y="280" width="230" height="100" rx="10" fill="#fff6e9" stroke="#e3ad71" stroke-width="1.5"/><text x="450.0" y="311" text-anchor="middle" font-size="21" font-weight="700" fill="#744114">失败分析与修复</text><text x="450.0" y="337" text-anchor="middle" font-size="17" fill="#744114">定位具体失效层</text><rect x="30" y="280" width="230" height="100" rx="10" fill="#fff" stroke="#c3d3e7" stroke-width="1.5"/><text x="145.0" y="311" text-anchor="middle" font-size="21" font-weight="700" fill="#14304f">回归集与版本记录</text><text x="145.0" y="337" text-anchor="middle" font-size="17" fill="#14304f">保留输入和结果证据</text><text x="450" y="454" text-anchor="middle" font-size="17" fill="#536b88">任务完成看产物与环境状态；“Agent 说成功”不是验收结果。</text></g></svg>