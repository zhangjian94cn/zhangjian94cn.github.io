<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" role="img" aria-labelledby="title desc"><title id="title">智能体的受控行动循环</title><desc id="desc">目标与状态进入模型，模型提出行动，执行器检查权限和预算，工具结果回到状态；完成或受阻时停止。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#6683aa"/></marker></defs><rect width="900" height="100%" fill="#f5f8fd" rx="14"/><g font-family="Inter,Noto Sans SC,Microsoft YaHei,sans-serif"><polyline points="270,88 335,88" fill="none" stroke="#6683aa" stroke-width="2.4" marker-end="url(#arrow)"/><polyline points="565,88 630,88" fill="none" stroke="#6683aa" stroke-width="2.4" marker-end="url(#arrow)"/><polyline points="748,135 748,245" fill="none" stroke="#6683aa" stroke-width="2.4" marker-end="url(#arrow)"/><text x="778" y="197" font-size="17" text-anchor="middle" fill="#50647f" paint-order="stroke" stroke="#f5f8fd" stroke-width="7">允许</text><polyline points="630,292 565,292" fill="none" stroke="#6683aa" stroke-width="2.4" marker-end="url(#arrow)"/><polyline points="450,245 450,135" fill="none" stroke="#6683aa" stroke-width="2.4" marker-end="url(#arrow)"/><text x="482" y="198" font-size="17" text-anchor="middle" fill="#50647f" paint-order="stroke" stroke="#f5f8fd" stroke-width="7">继续</text><polyline points="630,110 605,110 605,195 152,195 152,245" fill="none" stroke="#6683aa" stroke-width="2.4" marker-end="url(#arrow)"/><text x="242" y="184" font-size="17" text-anchor="middle" fill="#50647f" paint-order="stroke" stroke="#f5f8fd" stroke-width="7">验证后交付</text><polyline points="748,40 748,20 20,20 20,292 35,292" fill="none" stroke="#6683aa" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="35" y="40" width="235" height="95" rx="10" fill="#fff" stroke="#c3d3e7" stroke-width="1.5"/><text x="152.5" y="71" text-anchor="middle" font-size="21" font-weight="700" fill="#14304f">目标与任务状态</text><text x="152.5" y="97" text-anchor="middle" font-size="17" fill="#14304f">事实、约束、缺失信息</text><rect x="335" y="40" width="230" height="95" rx="10" fill="#155ce7" stroke="#155ce7" stroke-width="1.5"/><text x="450.0" y="71" text-anchor="middle" font-size="21" font-weight="700" fill="#fff">模型提出下一步</text><text x="450.0" y="97" text-anchor="middle" font-size="17" fill="#fff">调用工具 / 交付结果</text><rect x="630" y="40" width="235" height="95" rx="10" fill="#fff" stroke="#c3d3e7" stroke-width="1.5"/><text x="747.5" y="71" text-anchor="middle" font-size="21" font-weight="700" fill="#14304f">执行器检查</text><text x="747.5" y="97" text-anchor="middle" font-size="17" fill="#14304f">参数 · 权限 · 预算</text><rect x="630" y="245" width="235" height="95" rx="10" fill="#fff" stroke="#c3d3e7" stroke-width="1.5"/><text x="747.5" y="276" text-anchor="middle" font-size="21" font-weight="700" fill="#14304f">工具与环境</text><text x="747.5" y="302" text-anchor="middle" font-size="17" fill="#14304f">只执行被允许的动作</text><rect x="335" y="245" width="230" height="95" rx="10" fill="#fff" stroke="#c3d3e7" stroke-width="1.5"/><text x="450.0" y="276" text-anchor="middle" font-size="21" font-weight="700" fill="#14304f">观察与状态更新</text><text x="450.0" y="302" text-anchor="middle" font-size="17" fill="#14304f">结果、错误、证据</text><rect x="35" y="245" width="235" height="95" rx="10" fill="#fff6e9" stroke="#e3ad71" stroke-width="1.5"/><text x="152.5" y="276" text-anchor="middle" font-size="21" font-weight="700" fill="#744114">停止与交接</text><text x="152.5" y="302" text-anchor="middle" font-size="17" fill="#744114">完成 / 受阻 / 需人工</text><text x="450" y="405" text-anchor="middle" font-size="17" fill="#536b88">每轮记录可观察事件；预算或权限检查不通过时，停止并说明原因。</text><text x="450" y="439" text-anchor="middle" font-size="17" fill="#536b88">这是职责结构图，不表示模型内部思维过程。</text></g></svg>