<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 510" role="img" aria-labelledby="title desc"><title id="title">MCP 与 A2A 的职责</title><desc id="desc">应用通过 MCP 接工具与资源；通过 A2A 委托独立 Agent 服务并交换任务产物。两条连接仍需认证和业务授权。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#6683aa"/></marker></defs><rect width="900" height="100%" fill="#f5f8fd" rx="14"/><g font-family="Inter,Noto Sans SC,Microsoft YaHei,sans-serif"><polyline points="250,180 290,180 290,85 345,85" fill="none" stroke="#6683aa" stroke-width="2.4" marker-end="url(#arrow)"/><text x="290" y="143" font-size="17" text-anchor="middle" fill="#50647f" paint-order="stroke" stroke="#f5f8fd" stroke-width="7">MCP</text><polyline points="585,85 655,85" fill="none" stroke="#6683aa" stroke-width="2.4" marker-end="url(#arrow)"/><polyline points="250,245 290,245 290,360 345,360" fill="none" stroke="#6683aa" stroke-width="2.4" marker-end="url(#arrow)"/><text x="292" y="296" font-size="17" text-anchor="middle" fill="#50647f" paint-order="stroke" stroke="#f5f8fd" stroke-width="7">A2A</text><polyline points="585,360 655,360" fill="none" stroke="#6683aa" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="30" y="155" width="220" height="110" rx="10" fill="#155ce7" stroke="#155ce7" stroke-width="1.5"/><text x="140.0" y="186" text-anchor="middle" font-size="21" font-weight="700" fill="#fff">工单助手应用</text><text x="140.0" y="212" text-anchor="middle" font-size="17" fill="#fff">模型 + 客户端 + 状态</text><rect x="345" y="35" width="240" height="100" rx="10" fill="#fff" stroke="#c3d3e7" stroke-width="1.5"/><text x="465.0" y="66" text-anchor="middle" font-size="21" font-weight="700" fill="#14304f">知识库工具服务</text><text x="465.0" y="92" text-anchor="middle" font-size="17" fill="#14304f">工具、资源等能力</text><rect x="655" y="35" width="215" height="100" rx="10" fill="#fff" stroke="#c3d3e7" stroke-width="1.5"/><text x="762.5" y="66" text-anchor="middle" font-size="21" font-weight="700" fill="#14304f">内部知识库</text><text x="762.5" y="92" text-anchor="middle" font-size="17" fill="#14304f">政策与来源</text><rect x="345" y="310" width="240" height="100" rx="10" fill="#fff" stroke="#c3d3e7" stroke-width="1.5"/><text x="465.0" y="341" text-anchor="middle" font-size="21" font-weight="700" fill="#14304f">独立资产 Agent</text><text x="465.0" y="367" text-anchor="middle" font-size="17" fill="#14304f">任务、状态、产物</text><rect x="655" y="310" width="215" height="100" rx="10" fill="#fff" stroke="#c3d3e7" stroke-width="1.5"/><text x="762.5" y="341" text-anchor="middle" font-size="21" font-weight="700" fill="#14304f">资产调查报告</text><text x="762.5" y="367" text-anchor="middle" font-size="17" fill="#14304f">证据与未知项</text><text x="450" y="473" text-anchor="middle" font-size="17" fill="#536b88">标准连接不会自动授予业务权限，也不会使外部内容变成可信指令。</text></g></svg>