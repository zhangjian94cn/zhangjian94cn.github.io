<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 510" role="img" aria-labelledby="title desc"><title id="title">草案、人工核验与执行的边界</title><desc id="desc">只读 Agent 形成待审草案，人工流程核验并审批具体方案，执行服务独立检查后才可能产生业务动作。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#6683aa"/></marker></defs><rect width="900" height="100%" fill="#f5f8fd" rx="14"/><g font-family="Inter,Noto Sans SC,Microsoft YaHei,sans-serif"><polyline points="265,150 335,150" fill="none" stroke="#6683aa" stroke-width="2.4" marker-end="url(#arrow)"/><polyline points="565,150 635,150" fill="none" stroke="#6683aa" stroke-width="2.4" marker-end="url(#arrow)"/><polyline points="450,320 450,205" fill="none" stroke="#6683aa" stroke-width="2.4" marker-end="url(#arrow)"/><text x="503" y="272" font-size="17" text-anchor="middle" fill="#50647f" paint-order="stroke" stroke="#f5f8fd" stroke-width="7">仅作参考</text><rect x="30" y="95" width="235" height="110" rx="10" fill="#155ce7" stroke="#155ce7" stroke-width="1.5"/><text x="147.5" y="126" text-anchor="middle" font-size="21" font-weight="700" fill="#fff">只读 Agent</text><text x="147.5" y="152" text-anchor="middle" font-size="17" fill="#fff">工单 + 政策 → 草案</text><text x="147.5" y="178" text-anchor="middle" font-size="17" fill="#fff">无账户变更工具</text><rect x="335" y="95" width="230" height="110" rx="10" fill="#fff6e9" stroke="#e3ad71" stroke-width="1.5"/><text x="450.0" y="126" text-anchor="middle" font-size="21" font-weight="700" fill="#744114">人工业务流程</text><text x="450.0" y="152" text-anchor="middle" font-size="17" fill="#744114">独立核验 + 具体审批</text><text x="450.0" y="178" text-anchor="middle" font-size="17" fill="#744114">决定绑定方案版本</text><rect x="635" y="95" width="235" height="110" rx="10" fill="#fff" stroke="#c3d3e7" stroke-width="1.5"/><text x="752.5" y="126" text-anchor="middle" font-size="21" font-weight="700" fill="#14304f">执行服务（扩展）</text><text x="752.5" y="152" text-anchor="middle" font-size="17" fill="#14304f">检查授权、目标与参数</text><text x="752.5" y="178" text-anchor="middle" font-size="17" fill="#14304f">幂等执行并记录回执</text><rect x="335" y="320" width="230" height="90" rx="10" fill="#fff" stroke="#c3d3e7" stroke-width="1.5"/><text x="450.0" y="351" text-anchor="middle" font-size="21" font-weight="700" fill="#14304f">第二 AI 建议</text><text x="450.0" y="377" text-anchor="middle" font-size="17" fill="#14304f">补充分析，不产生授权</text><text x="450" y="469" text-anchor="middle" font-size="17" fill="#536b88">课程实验到草案交付为止；生产执行服务需另行设计与验收。</text></g></svg>